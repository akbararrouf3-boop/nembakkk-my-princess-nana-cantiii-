<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Untuk My Princess Nana Cantiii ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ffb6c1,
                    #ffc0cb,
                    #ffe4ec
                );

            min-height: 100vh;
            overflow-x: hidden;

            color: white;

            transition: background 1s;
        }


        /* =========================
           BUNGA JATUH
        ========================= */

        .flower {
            position: fixed;

            top: -40px;

            z-index: 1;

            pointer-events: none;

            animation:
                jatuh 7s linear forwards;
        }


        @keyframes jatuh {

            from {
                transform:
                    translateY(-40px)
                    rotate(0deg);

                opacity: 1;
            }

            to {
                transform:
                    translateY(110vh)
                    rotate(360deg);

                opacity: 0;
            }

        }


        /* =========================
           HALAMAN
        ========================= */

        .page {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            position: relative;

            z-index: 2;
        }


        .card {

            width: 100%;

            max-width: 600px;

            padding: 35px 25px;

            text-align: center;

            background:
                rgba(255,255,255,0.25);

            border:
                1px solid
                rgba(255,255,255,0.4);

            border-radius: 30px;

            box-shadow:
                0 15px 40px
                rgba(150,50,80,0.25);

            animation:
                muncul 0.8s ease;
        }


        .flower-icon {

            font-size: 60px;

            animation:
                goyang 2s infinite;
        }


        h1 {

            font-size: 32px;

            margin: 15px 0;
        }


        h2 {

            font-size: 26px;
        }


        p {

            font-size: 18px;

            line-height: 1.7;
        }


        .highlight {

            font-weight: bold;

            font-size: 21px;
        }


        /* =========================
           TYPING
        ========================= */

        .typing {

            min-height: 25px;
        }


        /* =========================
           BUTTON
        ========================= */

        button {

            border: none;

            padding: 14px 28px;

            border-radius: 30px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }


        .btn-start {

            margin-top: 20px;

            background: white;

            color: #ff5f8a;

            box-shadow:
                0 5px 15px
                rgba(0,0,0,0.15);
        }


        .btn-start:hover {

            transform: scale(1.05);
        }


        /* =========================
           SEMBUNYIKAN HALAMAN
        ========================= */

        #pesan,
        #kenangan,
        #pertanyaan,
        #akhir {

            display: none;
        }


        /* =========================
           LOVE
        ========================= */

        .love {

            font-size: 60px;

            animation:
                detak 1.2s infinite;
        }


        /* =========================
           BUTTON MAU / NGGAK
        ========================= */

        .buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 20px;

            margin-top: 30px;

            height: 80px;
        }


        #mau {

            background: #ff4f81;

            color: white;

            transition:
                transform 0.5s ease;
        }


        #tidak {

            background: white;

            color: #ff4f81;

            position: relative;

            /*
              Gerakan tombol dibuat
              lebih lambat dan halus
            */

            transition:
                left 1.2s ease,
                top 1.2s ease,
                transform 0.5s ease;
        }


        #peringatan {

            min-height: 25px;

            font-weight: bold;
        }


        /* =========================
           HATI
        ========================= */

        .heart {

            position: fixed;

            bottom: -30px;

            font-size: 25px;

            pointer-events: none;

            z-index: 100;

            animation:
                naik 4s linear forwards;
        }


        @keyframes naik {

            from {

                transform:
                    translateY(0)
                    scale(1);

                opacity: 1;
            }

            to {

                transform:
                    translateY(-110vh)
                    scale(1.8);

                opacity: 0;
            }

        }


        /* =========================
           CONFETTI
        ========================= */

        .confetti {

            position: fixed;

            top: -20px;

            z-index: 100;

            pointer-events: none;

            animation:
                confettiJatuh
                3s linear forwards;
        }


        @keyframes confettiJatuh {

            from {

                transform:
                    translateY(-20px)
                    rotate(0deg);

                opacity: 1;
            }

            to {

                transform:
                    translateY(110vh)
                    rotate(720deg);

                opacity: 0;
            }

        }


        /* =========================
           ANIMASI
        ========================= */

        @keyframes muncul {

            from {

                opacity: 0;

                transform:
                    scale(0.8);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);
            }

        }


        @keyframes detak {

            0% {

                transform:
                    scale(1);
            }

            50% {

                transform:
                    scale(1.2);
            }

            100% {

                transform:
                    scale(1);
            }

        }


        @keyframes goyang {

            0%, 100% {

                transform:
                    rotate(-5deg);
            }

            50% {

                transform:
                    rotate(5deg);
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width:500px) {

            .card {

                padding:
                    30px 18px;
            }


            h1 {

                font-size: 27px;
            }


            h2 {

                font-size: 23px;
            }


            p {

                font-size: 16px;
            }


            button {

                padding:
                    12px 20px;

                font-size: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HALAMAN 1
    ========================= -->

    <section
        class="page"
        id="awal">

        <div class="card">

            <div class="flower-icon">
                🌸
            </div>


            <h1
                id="judulAwal"
                class="typing">
            </h1>


            <p
                id="subAwal"
                class="typing">
            </p>


            <p
                id="namaAwal"
                class="highlight typing">
            </p>


            <button
                id="tombolAwal"
                class="btn-start"
                style="display:none;"
                onclick="mulai()">

                abuyy mau ngomong sesuatu 💌

            </button>

        </div>

    </section>


    <!-- =========================
         HALAMAN 2
    ========================= -->

    <section
        class="page"
        id="pesan">

        <div class="card">

            <div class="flower-icon">
                🌹
            </div>


            <h2
                id="judulPesan"
                class="typing">
            </h2>


            <p
                id="pesan1"
                class="typing">
            </p>


            <p
                id="pesan2"
                class="typing">
            </p>


            <p
                id="pesan3"
                class="highlight typing">
            </p>


            <p
                id="pesan4"
                class="typing">
            </p>


            <button
                id="tombolPesan"
                class="btn-start"
                style="display:none;"
                onclick="lihatKenangan()">

                ada sesuatu lagi... 💗

            </button>

        </div>

    </section>


    <!-- =========================
         HALAMAN 3
    ========================= -->

    <section
        class="page"
        id="kenangan">

        <div class="card">

            <div class="flower-icon">
                🌷
            </div>


            <h2
                id="judulKenangan"
                class="typing">
            </h2>


            <p
                id="kenangan1"
                class="typing">
            </p>


            <p
                id="kenangan2"
                class="typing">
            </p>


            <p
                id="kenangan3"
                class="highlight typing">
            </p>


            <button
                id="tombolKenangan"
                class="btn-start"
                style="display:none;"
                onclick="lanjut()">

                lanjut... 💌

            </button>

        </div>

    </section>


    <!-- =========================
         HALAMAN 4
    ========================= -->

    <section
        class="page"
        id="pertanyaan">

        <div class="card">

            <div class="love">
                ❤️
            </div>


            <h2
                id="judulTanya"
                class="typing">
            </h2>


            <p
                id="tanya1"
                class="typing">
            </p>


            <p
                id="tanya2"
                class="typing">
            </p>


            <h1
                id="tanya3"
                class="typing">
            </h1>


            <div
                id="pilihan"
                class="buttons"
                style="display:none;">

                <button
                    id="mau"
                    onclick="mau()">

                    MAU ❤️

                </button>


                <button
                    id="tidak">

                    NGGAK 😭

                </button>

            </div>


            <p id="peringatan"></p>

        </div>

    </section>


    <!-- =========================
         HALAMAN 5
    ========================= -->

    <section
        class="page"
        id="akhir">

        <div class="card">

            <div class="love">
                💗
            </div>


            <h1
                id="akhir1"
                class="typing">
            </h1>


            <h2
                id="akhir2"
                class="typing">
            </h2>


            <p
                id="akhir3"
                class="typing">
            </p>


            <p
                id="akhir4"
                class="highlight typing">
            </p>


            <p
                id="akhir5"
                class="typing">
            </p>


            <p
                id="akhir6"
                class="typing">
            </p>


            <p
                id="akhir7"
                class="highlight typing">
            </p>


            <div class="love">
                🌸❤️🌸
            </div>


            <p
                id="akhir8"
                class="typing">
            </p>

        </div>

    </section>



    <script>


        /* =========================
           FUNGSI TYPING
        ========================= */

        function ketik(id, teks, selesai) {

            var element =
                document.getElementById(id);

            var i = 0;

            element.innerHTML = "";


            function mulaiKetik() {

                if (i < teks.length) {

                    element.innerHTML +=
                        teks.charAt(i);

                    i++;


                    /*
                       KECEPATAN KETIKAN

                       70 = lebih lambat
                       dibanding versi sebelumnya
                    */

                    setTimeout(
                        mulaiKetik,
                        70
                    );

                } else {

                    if (selesai) {

                        setTimeout(
                            selesai,
                            400
                        );

                    }

                }

            }


            mulaiKetik();

        }



        /* =========================
           HALAMAN AWAL
        ========================= */

        window.onload = function() {

            ketik(
                "judulAwal",

                "Welcome to Princess Nana's Little World ❤️",

                function() {

                    ketik(
                        "subAwal",

                        "untuk seseorang yang sangat spesial",

                        function() {

                            ketik(
                                "namaAwal",

                                "My Princess Nana Cantiii 🌷",

                                function() {

                                    document
                                        .getElementById(
                                            "tombolAwal"
                                        )
                                        .style.display =
                                        "inline-block";

                                }
                            );

                        }
                    );

                }
            );

        };



        /* =========================
           MULAI
        ========================= */

        function mulai() {

            document
                .getElementById("awal")
                .style.display =
                "none";


            document
                .getElementById("pesan")
                .style.display =
                "flex";


            ketik(
                "judulPesan",

                "buat my princess nana cantiii",

                function() {

                    ketik(
                        "pesan1",

                        "abuyy sebenarnya dari tadi pengen ngomong sesuatu sama nana...",

                        function() {

                            ketik(
                                "pesan2",

                                "mungkin kata-kata abuyy nggak selalu sempurna tapi ada satu hal yang benar-benar abuyy rasain",

                                function() {

                                    ketik(
                                        "pesan3",

                                        "abuyy nyaman banget sama nana ❤️",

                                        function() {

                                            ketik(
                                                "pesan4",

                                                "setiap kali ngobrol sama nana rasanya selalu ada sesuatu yang bikin abuyy senyum sendiri",

                                                function() {

                                                    document
                                                        .getElementById(
                                                            "tombolPesan"
                                                        )
                                                        .style.display =
                                                        "inline-block";

                                                }
                                            );

                                        }
                                    );

                                }
                            );

                        }
                    );

                }
            );

        }



        /* =========================
           KENANGAN
        ========================= */

        function lihatKenangan() {

            document
                .getElementById("pesan")
                .style.display =
                "none";


            document
                .getElementById("kenangan")
                .style.display =
                "flex";


            ketik(
                "judulKenangan",

                "sedikit tentang kita ❤️",

                function() {

                    ketik(
                        "kenangan1",

                        "mungkin tidak banyak yang bisa abuyy tunjukkan lewat kata-kata, tapi setiap momen bersama nana tetap punya arti sendiri.",

                        function() {

                            ketik(
                                "kenangan2",

                                "dari hal-hal kecil sampai percakapan sederhana, semuanya menjadi bagian dari cerita yang abuyy ingat.",

                                function() {

                                    ketik(
                                        "kenangan3",

                                        "karena buat abuyy, nana itu spesial ❤️",

                                        function() {

                                            document
                                                .getElementById(
                                                    "tombolKenangan"
                                                )
                                                .style.display =
                                                "inline-block";

                                        }
                                    );

                                }
                            );

                        }
                    );

                }
            );

        }



        /* =========================
           PERTANYAAN
        ========================= */

        function lanjut() {

            document
                .getElementById("kenangan")
                .style.display =
                "none";


            document
                .getElementById("pertanyaan")
                .style.display =
                "flex";


            ketik(
                "judulTanya",

                "jadi abuyy mau tanya...",

                function() {

                    ketik(
                        "tanya1",

                        "setelah semua yang kita lewatin dan semua rasa yang abuyy punya",

                        function() {

                            ketik(
                                "tanya2",

                                "abuyy nggak mau maksa nana buat jawab sesuatu yang nana nggak mau.",

                                function() {

                                    ketik(
                                        "tanya3",

                                                                                "Nana mau nggak jadi pacarnya abuyy? 💗",

                                        function() {

                                            document
                                                .getElementById(
                                                    "pilihan"
                                                )
                                                .style.display =
                                                "flex";

                                        }
                                    );

                                }
                            );

                        }
                    );

                }
            );

        }



        /* =========================
           TOMBOL MAU
        ========================= */

        var ukuranMau = 1;


        function mau() {

            document
                .getElementById(
                    "pertanyaan"
                )
                .style.display =
                "none";


            document
                .getElementById(
                    "akhir"
                )
                .style.display =
                "flex";


            document.body.style.background =
                "linear-gradient(135deg, #ff6f91, #ffc2d1)";


            ketik(
                "akhir1",

                "YAYYYYY ❤️",

                function() {

                    ketik(
                        "akhir2",

                        "akhirnya nana mau",

                        function() {

                            ketik(
                                "akhir3",

                                "mulai hari ini...",

                                function() {

                                    ketik(
                                        "akhir4",

                                        "nana adalah princess-nya abuyy 👑❤️",

                                        function() {

                                            ketik(
                                                "akhir5",

                                                "makasih sudah mau menjadi bagian dari cerita abuyy",

                                                function() {

                                                    ketik(
                                                        "akhir6",

                                                        "semoga kita bisa terus saling menjaga, saling mengerti, dan membuat banyak kenangan indah bersama 🌷",

                                                        function() {

                                                            ketik(
                                                                "akhir7",

                                                                "abuyy sayang banget sama nana ❤️",

                                                                function() {

                                                                    ketik(
                                                                        "akhir8",

                                                                        "My Princess Nana Cantiii"

                                                                    );

                                                                }
                                                            );

                                                        }
                                                    );

                                                }
                                            );

                                        }
                                    );

                                }
                            );

                        }
                    );

                }
            );



            /* =========================
               HATI
            ========================= */

            for (
                var i = 0;
                i < 50;
                i++
            ) {

                setTimeout(
                    buatHati,
                    i * 80
                );

            }



            /* =========================
               CONFETTI
            ========================= */

            for (
                var j = 0;
                j < 40;
                j++
            ) {

                setTimeout(
                    buatConfetti,
                    j * 70
                );

            }

        }



        /* =========================
           TOMBOL NGGAK
        ========================= */

        var tidak =
            document.getElementById(
                "tidak"
            );


        var mauButton =
            document.getElementById(
                "mau"
            );


        var peringatan =
            document.getElementById(
                "peringatan"
            );


        function kabur() {

            var margin = 20;


            var maxX =
                window.innerWidth -
                tidak.offsetWidth -
                margin;


            var maxY =
                window.innerHeight -
                tidak.offsetHeight -
                margin;


            var x =
                Math.random() * maxX;


            var y =
                Math.random() * maxY;


            if (x < margin) {

                x = margin;

            }


            if (y < margin) {

                y = margin;

            }


            /*
               Tombol berpindah
               dengan gerakan lambat
            */

            tidak.style.position =
                "fixed";


            tidak.style.left =
                x + "px";


            tidak.style.top =
                y + "px";


            ukuranMau += 0.08;


            mauButton.style.transform =
                "scale(" +
                ukuranMau +
                ")";


            var teks = [

                "eh jangan 😭",

                "jangan pilih ini 😭",

                "salah tombol wkwk",

                "coba yang MAU ❤️",

                "hehe nggak bisa 😭",

                "ayo pencet MAU ❤️",

                "kok dikejar terus 😭",

                "kabur duluuu 🏃‍♀️💨",

                "hehe hampir kena 😭",

                "NGGAK boleh 😭❤️"

            ];


            peringatan.innerHTML =
                teks[
                    Math.floor(
                        Math.random() *
                        teks.length
                    )
                ];

        }



        tidak.addEventListener(
            "mouseenter",
            kabur
        );


        tidak.addEventListener(
            "touchstart",

            function(e) {

                e.preventDefault();

                kabur();

            }

        );



        /* =========================
           HATI
        ========================= */

        function buatHati() {

            var heart =
                document.createElement(
                    "div"
                );


            heart.className =
                "heart";


            var bentuk = [

                "❤️",
                "💗",
                "💖",
                "💕",
                "💞",
                "🌸"

            ];


            heart.innerHTML =
                bentuk[
                    Math.floor(
                        Math.random() *
                        bentuk.length
                    )
                ];


            heart.style.left =
                Math.random() *
                100 +
                "vw";


            heart.style.fontSize =
                (
                    20 +
                    Math.random() *
                    25
                ) +
                "px";


            document.body.appendChild(
                heart
            );


            setTimeout(

                function() {

                    heart.remove();

                },

                5000

            );

        }



        /* =========================
           CONFETTI
        ========================= */

        function buatConfetti() {

            var confetti =
                document.createElement(
                    "div"
                );


            confetti.className =
                "confetti";


            var bentuk = [

                "❤️",
                "💗",
                "💖",
                "🌸",
                "🌷",
                "✨"

            ];


            confetti.innerHTML =
                bentuk[
                    Math.floor(
                        Math.random() *
                        bentuk.length
                    )
                ];


            confetti.style.left =
                Math.random() *
                100 +
                "vw";


            confetti.style.fontSize =
                (
                    12 +
                    Math.random() *
                    18
                ) +
                "px";


            document.body.appendChild(
                confetti
            );


            setTimeout(

                function() {

                    confetti.remove();

                },

                4000

            );

        }



        /* =========================
           BUNGA JATUH
        ========================= */

        function buatBunga() {

            var flower =
                document.createElement(
                    "div"
                );


            flower.className =
                "flower";


            var bentuk = [

                "🌸",
                "🌷",
                "🌹",
                "🌺",
                "💮"

            ];


            flower.innerHTML =
                bentuk[
                    Math.floor(
                        Math.random() *
                        bentuk.length
                    )
                ];


            flower.style.left =
                Math.random() *
                100 +
                "vw";


            flower.style.fontSize =
                (
                    15 +
                    Math.random() *
                    25
                ) +
                "px";


            document.body.appendChild(
                flower
            );


            setTimeout(

                function() {

                    flower.remove();

                },

                7000

            );

        }


        setInterval(
            buatBunga,
            800
        );


    </script>

</body>
</html>
